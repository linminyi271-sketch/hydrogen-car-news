<script>
const news=[{"region":"亞洲","title":"韓國起亞計畫 2029 年量產首款氫燃料電池 Carnival","source":"Money Today","date":"2026-10-26","summary":"韓國起亞汽車據報計畫於 2029 年量產首款氫燃料電池車，並以新一代 Carnival 大型多功能休旅車為開發基礎。根據韓國汽車產業消息，起亞管理層與工會已就 2027 年至 2029 年的主要車款生產時程達成協議，其中包括於京畿道光明第一工廠生產搭載新一代氫燃料電池系統的 Carnival 車型。","url":"https://www.mt.co.kr/en/industry/2026/10/26/2026102609075695283","tags":["氫燃料電池乘用車","車廠布局"]},{"region":"亞洲","title":"韓國現代汽車將首度公開新一代商用車氫燃料電池系統","source":"Seoul Economic Daily","date":"2026-10-28","summary":"現代汽車集團將於 11 月 4 日至 6 日舉行的 2026 世界氫能博覽會，首次展示針對商用車開發的高耐久性氫燃料電池系統，滿足重型卡車及巴士長時間、高載重運輸需求。另將示範自動加氫機器人、車隊監控技術及開發中的 Elec City 氫燃料電池客運巴士。","url":"https://en.sedaily.com/finance/2026/10/28/hyundai-motor-group-to-unveil-commercial-hydrogen-fuel-cell","tags":["氫燃料電池商用車","加氫與營運"]},{"region":"亞洲","title":"現代新一代 NEXO 氫燃料電池車進軍日本計程車市場，入圍 2026 至 2027 日本年度風雲車","source":"STARNEWS","date":"2026-10-29","summary":"現代新一代 NEXO 入圍 2026 至 2027 日本年度風雲車候選名單，並拓展東京及愛知縣計程車應用。新車搭載 94 kW 燃料電池系統及 80 kW 高壓電池，依日本 WLTC 標準單次加氫續航達 1,014 公里。東京都規劃 2030 年前導入 600 輛氫能計程車。","url":"https://www.starnewskorea.com/en/business-life/2026/10/29/2026102911012317044","tags":["氫燃料電池乘用車","商用車應用"]},{"region":"國際","title":"美國加州選定 Xpan 開發全州氫燃料電池巴士培訓計畫，強化車輛操作與維修技術","source":"EIN Presswire","date":"2026-10-27","summary":"Xpan Interactive 獲加州公共運輸培訓聯盟選定，攜手 ZEB Tech 開發全州氫燃料電池巴士培訓計畫，課程涵蓋氫能基礎、巴士維護、故障排除、車輛操作及預防性保養，並結合線上與實體訓練。","url":"https://tech.einnews.com/pr_news/951819859/xpan-selected-by-california-transit-training-consortium-to-develop-statewide-fuel-cell-electric-bus-training-program","tags":["氫燃料電池巴士","維運與人才培訓"]},{"region":"國際","title":"加拿大 Ballard 推出 80 kW 可拖曳式氫燃料電池發電設備，提供移動式零排放電力解決方案","source":"Ballard Power Systems","date":"2026-10-28","summary":"Ballard 與 GeoPura 推出 HPU Agile-H 可拖曳式氫燃料電池發電設備，整合燃料電池與電池儲能，可持續提供 80 kW 電力，應用於工地、活動展演、影視製作、電動車充電及緊急備援。預計 2027 年第一季開始交付。","url":"https://www.ballard.com/press-release/ballard-launches-hpu-agile-h-80kw-of-clean-power-in-a-lightweight-towable-unit/","tags":["燃料電池技術","氫能應用"]},{"region":"國際","title":"芬蘭 SISU 結合氫燃料電池與電池動力技術，開發 68 噸零排放重型卡車","source":"Motorindia","date":"2026-10-29","summary":"芬蘭 VTT 與 Sisu Auto 合作開發 SISU Escalate 氫燃料電池混合動力重型卡車，搭載 650 kWh 電池及最大輸出 120 kW 燃料電池，預計 2026 年底展開長途物流測試，蒐集能耗、冬季運行及可靠性數據。","url":"https://www.motorindiaonline.in/sisu-truck-combines-hydrogen-and-electricity-to-tackle-emission-free-heavy-duty-transport/","tags":["氫燃料電池卡車","重型物流"]},{"region":"國際","title":"WPIC 指出歐洲車廠加速布局氫能重型運輸，豐田、Volvo 及 Daimler 推動燃料電池卡車發展","source":"Mining Weekly","date":"2026-10-30","summary":"世界鉑金投資協會指出，Volvo、Daimler Truck、Toyota 等企業正推動氫能重型運輸。報導提及氫內燃機卡車道路測試、新一代燃料電池重卡，以及 Toyota 與 Iveco 合作開發零排放重型車輛，促進氫燃料電池卡車商業化。","url":"https://www.miningweekly.com/article/platinum-catalysed-hydrogen-mobility-receiving-strong-backing-says-wpic-2026-10-29","tags":["氫燃料電池卡車","車廠布局"]},{"region":"國際","title":"斯洛維尼亞首都盧布爾雅那正式啟用 10 輛賓士氫燃料電池巴士，推動零排放公共運輸","source":"Sustainable Bus","date":"2026-10-30","summary":"盧布爾雅那公共運輸業者 LPP 投入 35 輛 Mercedes-Benz 零排放巴士，包括 25 輛純電巴士及 10 輛 eCitaro G 氫燃料電池鉸接式巴士，並建置充電與加氫設施，整合兩種零排放動力技術。","url":"https://www.sustainable-bus.com/news/slovenia-ljubljana-mercedes-ecitaro-electric-buses-lpp/","tags":["氫燃料電池巴士","公共運輸"]},{"region":"國際","title":"德國法蘭克福零排放公車突破 100 輛，32 輛氫燃料電池巴士投入營運","source":"traffiQ","date":"2026-10-30","summary":"法蘭克福 418 輛公車中已有 109 輛採低排放動力，包括 77 輛純電巴士及 32 輛氫燃料電池巴士。當地規劃擴充零排放運輸設施，目標於 2033 年完成全市公車車隊轉型。","url":"https://www.traffiq.de/traffiq/medien/presse-informationen/presse-information/frankfurt-unter-strom-100-elektrobus-faehrt-durch-die-stadt.html","tags":["氫燃料電池巴士","公共運輸"]},{"region":"國際","title":"義大利 APT Gorizia 啟用綠氫製儲加氫一體化設施，支援 9 輛氫燃料電池巴士營運","source":"Il Goriziano","date":"2026-10-31","summary":"APT Gorizia 在 Monfalcone 啟用綠氫生產、儲存與加氫一體化設施，支援 9 輛 IVECO E-Way H2 氫燃料電池巴士。設施結合太陽能與電解製氫，現階段製氫系統功率 1 MW，每日最大產氫量 453 公斤。","url":"https://www.ilgoriziano.it/articolo/apt-gorizia-taglia-nastro-impianto-idrogeno-verde-lisert-unicum-italia-31-ottobre-2026","tags":["綠氫與加氫設施","氫燃料電池巴士"]}];
const results=document.getElementById('results'),q=document.getElementById('q');let region='all';
function render(){const term=q.value.trim().toLocaleLowerCase();const rows=news.filter(n=>(region==='all'||n.region===region)&&(!term||[n.title,n.summary,n.source,n.tags.join(' ')].join(' ').toLocaleLowerCase().includes(term)));results.innerHTML='';if(!rows.length){results.innerHTML='<div class="empty">找不到符合條件的新聞，請調整搜尋關鍵字。</div>';return;} (region==='all'?['亞洲','國際']:[region]).forEach(g=>{const list=rows.filter(n=>n.region===g);if(!list.length)return;const h=document.createElement('h2');h.className='section-title';h.textContent=g+'新聞';results.appendChild(h);const grid=document.createElement('div');grid.className='cards';list.forEach(n=>{const c=document.createElement('article'),m=document.createElement('div'),t=document.createElement('h2'),s=document.createElement('p'),tags=document.createElement('div'),a=document.createElement('a');m.className='article-meta';m.textContent=n.date.replaceAll('-','/')+' · '+n.source;t.textContent=n.title;s.className='summary';s.textContent=n.summary;tags.className='tags';n.tags.forEach(v=>{const x=document.createElement('span');x.className='tag';x.textContent=v;tags.appendChild(x)});a.className='read';a.href=n.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='閱讀原文 ↗';c.append(m,t,s,tags,a);grid.appendChild(c)});results.appendChild(grid)})}
q.addEventListener('input',render);document.querySelectorAll('[data-region]').forEach(b=>b.addEventListener('click',()=>{region=b.dataset.region;document.querySelectorAll('[data-region]').forEach(x=>x.classList.toggle('active',x===b));render()}));render();
